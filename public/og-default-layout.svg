<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">机上レイアウトシミュレータの初期配置</title>
  <desc id="desc">幅180 cmの机に27インチモニターを２台置いた正面図</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#e7f2f5"/>
    </linearGradient>
    <linearGradient id="screen" x2="1" y2="1">
      <stop stop-color="#183c51"/>
      <stop offset="1" stop-color="#2b7185"/>
    </linearGradient>
    <linearGradient id="shine" x2="1" y2="1">
      <stop stop-color="#68c4d2" stop-opacity=".43"/>
      <stop offset=".8" stop-color="#68c4d2" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e7eff3" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2a5c70" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1095" cy="85" r="215" fill="#d5edf1" opacity=".4"/>
  <rect x="64" y="42" width="38" height="38" rx="10" fill="#147d95"/>
  <path d="M73 53h20v13H73zM83 66v7m-6 0h12" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="116" y="68" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#147d95">DESK PLAN</text>
  <text x="63" y="143" font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="48" font-weight="800" fill="#193243">机上レイアウトシミュレータ</text>
  <text x="66" y="184" font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="21" fill="#657b88">机とモノの配置を、三面図で確認。</text>
  <rect x="916" y="143" width="220" height="38" rx="19" fill="#dceff3"/>
  <text x="1026" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.3" fill="#147d95">DEFAULT LAYOUT</text>

  <rect x="64" y="210" width="1072" height="390" rx="20" fill="white" filter="url(#shadow)"/>
  <rect x="65" y="211" width="1070" height="388" rx="19" fill="url(#grid)"/>
  <path d="M84 210h1032a20 20 0 0 1 20 20v41H64v-41a20 20 0 0 1 20-20z" fill="#fff"/>
  <path d="M64 271h1072" stroke="#e2eaf0"/>
  <circle cx="93" cy="241" r="5" fill="#147d95"/>
  <text x="110" y="248" font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="700" fill="#193243">正面図</text>
  <text x="202" y="246" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.6" fill="#91a4af">FRONT VIEW</text>
  <text x="1104" y="246" text-anchor="end" font-family="Noto Sans JP, Yu Gothic, Meiryo, sans-serif" font-size="14" fill="#657b88">机 180 × 50 cm  ·  27インチモニター × 2</text>

  <!-- The monitor widths and positions follow the app's default 180 cm desk layout. -->
  <rect x="275" y="311" width="286" height="160" rx="10" fill="#183243"/>
  <rect x="283" y="319" width="270" height="144" rx="4" fill="url(#screen)"/>
  <rect x="283" y="319" width="270" height="144" rx="4" fill="url(#shine)"/>
  <path d="M310 439l125-110M349 453l92-80" stroke="#8dd3dc" stroke-width="2" opacity=".13"/>
  <circle cx="418" cy="467" r="2" fill="#69bbcb"/>
  <path d="M418 472v42" stroke="#405c69" stroke-width="7" stroke-linecap="round"/>
  <rect x="389" y="511" width="58" height="7" rx="3.5" fill="#405c69"/>

  <rect x="638" y="311" width="286" height="160" rx="10" fill="#183243"/>
  <rect x="646" y="319" width="270" height="144" rx="4" fill="url(#screen)"/>
  <rect x="646" y="319" width="270" height="144" rx="4" fill="url(#shine)"/>
  <path d="M673 439l125-110M712 453l92-80" stroke="#8dd3dc" stroke-width="2" opacity=".13"/>
  <circle cx="781" cy="467" r="2" fill="#69bbcb"/>
  <path d="M781 472v42" stroke="#405c69" stroke-width="7" stroke-linecap="round"/>
  <rect x="752" y="511" width="58" height="7" rx="3.5" fill="#405c69"/>

  <rect x="170" y="518" width="860" height="12" rx="4" fill="#80bdc9"/>
  <path d="M170 522h860" stroke="#d5edf1" stroke-width="2"/>
  <rect x="194" y="530" width="15" height="34" rx="2" fill="#a2c7d1"/>
  <rect x="991" y="530" width="15" height="34" rx="2" fill="#a2c7d1"/>
  <path d="M170 574h860M170 568v12M1030 568v12" fill="none" stroke="#86a6b4" stroke-width="1.5"/>
  <rect x="559" y="563" width="82" height="22" rx="11" fill="white"/>
  <text x="600" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#557684">180 cm</text>
</svg>
